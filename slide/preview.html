<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem trước slide</title>
<link rel="stylesheet" href="app.css">
<style>
html,body{background:#eef3fb!important;overflow:hidden}
#stageWrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.slide{transition:none!important}
#cap{position:fixed;left:8px;bottom:6px;z-index:5;font:600 11px "Segoe UI",sans-serif;color:#fff;background:rgba(11,37,89,.78);padding:3px 9px;border-radius:10px;pointer-events:none}
</style>
</head>
<body>
<div id="stageWrap"><div id="stage"></div></div>
<div id="cap"></div>
<script src="clb-config.js"></script>
<script>window.CLB_ASSETS = 'assets/';</script>
<script src="slides.js"></script>
<script src="clb-data.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  let data = null, msg = null;
  const CK = 'clb-cache-v1';

  function fit() {
    const w = $('stageWrap').clientWidth, h = $('stageWrap').clientHeight;
    stage.style.transform = 'scale(' + Math.min(w / 1920, h / 1080) + ')';
  }
  addEventListener('resize', () => { fit(); });

  const fmtDate = (v) => { const p = String(v || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; };

  // Ap du lieu dang nhap trong bieu mau len du lieu hien tai de xem truoc
  function overlay(st, m, key) {
    const s = JSON.parse(JSON.stringify(st));
    s.months = s.months || {};
    const mo = (s.months[key] = s.months[key] || {});
    const f = m && m.form; if (!f) return { st: s, target: null };
    let target = null;
    if (m.kind === 'dienGia') {
      mo.dienGia = Object.assign({}, mo.dienGia, { ten: f.hoTen || '', chucDanh: f.chucDanh || '', noiDung: f.noiDung || '', link: f.linkBai || '', anh: m.photo || '' });
      if (f.chuDe) mo.chuDe = Object.assign({}, mo.chuDe, { tieuDe: f.chuDe });
      target = 'diengia';
    } else if (m.kind === 'showcase') {
      mo.showcase = Object.assign({}, mo.showcase, { ten: String(f.hoTen || '').toUpperCase(), dn: f.doanhNghiep || '', gioiThieu: f.gioiThieu || '', sanPham: f.sanPham || '', khachHang: f.khachHang || '', link: f.linkBai || '', anh: m.photo || '' });
      target = 'showcase';
    } else if (m.kind === 'hoiVien') {
      const arr = (mo.hoiVienMoi || []).slice();
      const mem = { ten: String(f.hoTen || '').toUpperCase(), dn: f.congTy || '', nganh: f.nganhNghe || '', diaChi: f.diaChi || '', triLy: '', anh: m.photo || '' };
      let idx = m.editingId ? arr.findIndex((h) => h.id === m.editingId) : -1;
      if (idx >= 0) { mem.triLy = arr[idx].triLy || ''; arr[idx] = Object.assign({}, arr[idx], mem); } else { arr.push(mem); idx = arr.length - 1; }
      mo.hoiVienMoi = arr; target = 'ketnap-' + (idx + 1);
    } else if (m.kind === 'suKien') {
      const when = [fmtDate(f.ngay), f.gio].filter(Boolean).join(' · ');
      const ev = { ten: String(f.tenSuKien || 'SỰ KIỆN MỚI').toUpperCase(), moTa: [when, f.diaDiem, f.moTa].filter(Boolean).join(' — ') };
      s.fixed = s.fixed || {}; s.fixed.suKien = [ev].concat((s.fixed.suKien || []).slice(0, 5)); target = 'sukien';
    } else if (m.kind === 'taiChinh' && m.fin) {
      mo.taiChinh = { dauKy: Number(m.fin.dauKy) || 0, thu: (m.fin.thu || []).map((x) => ({ ten: x.ten, so: Number(x.so) || 0, ghiChu: '' })),
        chi: (m.fin.chi || []).map((x) => ({ ten: x.ten, so: Number(x.so) || 0, ghiChu: '' })), ghiChu: f.ghiChu || '' };
      target = 'taichinh';
    }
    return { st: s, target };
  }
  const DEFAULT_ID = { dienGia: 'diengia', showcase: 'showcase', suKien: 'sukien', taiChinh: 'taichinh', hoiVien: 'ketnap-1' };
  const NAME = { diengia: 'Diễn giả', showcase: 'Showcase', sukien: 'Sự kiện trọng điểm', taichinh: 'Báo cáo tài chính' };

  function render() {
    if (!data) return;
    const m = msg || {};
    const key = (m.thang && /^\d{4}-\d{2}$/.test(m.thang)) ? m.thang : CLB.monthKey();
    const base = CLBData.merge(data.base, data.ex);
    // Khi chua nhap gi: neu thang dang chon chua co du lieu thi hien thang gan nhat co du lieu ("du lieu cu gan nhat")
    const has = (mo) => { mo = mo || {}; return m.kind === 'dienGia' ? !!(mo.dienGia && mo.dienGia.ten) : m.kind === 'showcase' ? !!(mo.showcase && mo.showcase.ten)
      : m.kind === 'hoiVien' ? !!(mo.hoiVienMoi && mo.hoiVienMoi.length) : m.kind === 'taiChinh' ? !!(mo.taiChinh && (mo.taiChinh.dauKy || (mo.taiChinh.thu || []).length)) : true; };
    let useKey = key, fallback = false;
    if (!m.form && !has((base.months || {})[key])) {
      const ks = Object.keys(base.months || {}).sort().reverse();
      const f = ks.find((x) => has(base.months[x]));
      if (f) { useKey = f; fallback = true; }
    }
    const o = overlay(base, m, useKey);
    const slides = CLB.build(o.st, useKey);
    let id = o.target || DEFAULT_ID[m.kind] || 'bia';
    let sl = slides.find((x) => x.id === id);
    if (!sl && m.kind === 'hoiVien') sl = slides.find((x) => x.id === 'ketnap-0');
    if (!sl) sl = slides[0];
    stage.innerHTML = '<section class="slide on" style="opacity:1">' + sl.html + '</section>';
    fit();
    const p = CLB.parseKey(useKey);
    $('cap').textContent = (o.target ? 'Xem trước: ' : (fallback ? 'Gần nhất: ' : 'Hiện tại: ')) + (NAME[sl.id] || (sl.id.indexOf('ketnap') === 0 ? 'Hội viên mới' : sl.id)) + ' · tháng ' + p.m + '/' + p.y;
  }

  addEventListener('message', (e) => { const d = e.data || {}; if (d.type === 'clb-preview') { msg = d; render(); } });

  // du lieu: hien ngay ban luu tren trinh duyet / ban goc, sau do cap nhat tu Google
  (async function () {
    try { const c = JSON.parse(localStorage.getItem(CK) || 'null'); if (c && c.base) { data = { base: c.base, ex: c.ex || {} }; render(); } } catch (e) {}
    if (!data) { try { data = await CLBData.loadSeed(); render(); } catch (e) {} }
    try { const d = await CLBData.load(); data = d; render(); } catch (e) {}
  })();
})();
</script>
</body>
</html>
