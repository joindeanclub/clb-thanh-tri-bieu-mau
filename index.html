<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLB Doanh nghiệp Thanh Trì</title>
<link rel="icon" href="slide/assets/image6.png">
<style>
:root{--navy:#0b2559;--blue:#1760c4;--gold:#d99a14;--line:#e1e8f4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1224;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:14px;padding:8px 14px;background:var(--navy);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.35);z-index:5}
header img{height:38px;width:38px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}
header b{font-size:16px;letter-spacing:.2px;white-space:nowrap}
nav{display:flex;gap:6px;margin-left:auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{flex:none;border:0;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;background:rgba(255,255,255,.12);color:#fff;transition:background .15s}
nav button:hover{background:rgba(255,255,255,.22)}
nav button.on{background:#fff;color:var(--navy)}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
iframe.on{display:block}
#fsHint{display:none}
@media(max-width:640px){header b{display:none}nav{margin-left:0;flex:1}nav button{padding:9px 12px;font-size:13.5px}}
</style>
</head>
<body>
<header>
  <img src="slide/assets/image6.png" alt="">
  <b>CLB Doanh nghiệp Thanh Trì</b>
  <nav id="nav">
    <button data-t="trinhchieu" class="on">🎬 Trình chiếu</button>
    <button data-t="sua">✏️ Sửa slide</button>
    <button data-t="nhap">✍️ Nhập thông tin</button>
    <button data-t="thieu">📋 Còn thiếu</button>
  </nav>
</header>
<main>
  <iframe id="fSlide" title="Trình chiếu" allow="fullscreen; autoplay" allowfullscreen></iframe>
  <iframe id="fNhap" title="Nhập thông tin" allow="fullscreen"></iframe>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var fs = $('fSlide'), fn = $('fNhap'), slideReady = false, queue = [];
  var TABS = { trinhchieu: 'slide', sua: 'slide', thieu: 'slide', nhap: 'nhap' };

  function send(msg) {
    if (slideReady) { try { fs.contentWindow.postMessage(msg, '*'); } catch (e) {} } else queue.push(msg);
  }
  fs.addEventListener('load', function () { slideReady = true; queue.splice(0).forEach(send); });

  function show(tab, opt) {
    opt = opt || {};
    var which = TABS[tab] || 'slide';
    [].forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === tab); });
    fs.classList.toggle('on', which === 'slide');
    fn.classList.toggle('on', which === 'nhap');
    if (which === 'slide') {
      if (!fs.getAttribute('src')) fs.setAttribute('src', 'slide/');
      send({ type: 'clb-edit', on: tab === 'sua' });
      if (tab === 'thieu') send({ type: 'clb-missing' });
    } else {
      var ban = opt.ban ? '#ban=' + opt.ban : '';
      if (!fn.getAttribute('src')) fn.setAttribute('src', 'nhap.html' + ban);
      else if (ban) { try { fn.contentWindow.location.hash = ban.slice(1); } catch (e) { fn.setAttribute('src', 'nhap.html' + ban); } }
    }
    try { history.replaceState(null, '', '#' + tab); } catch (e) {}
  }

  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (b) show(b.getAttribute('data-t'));
  });
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if (d.type === 'clb-open-form') show('nhap', { ban: d.ban });
    else if (d.type === 'clb-edit-state') {
      var on = document.querySelector('#nav button.on');
      if (d.on) { [].forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === 'sua'); }); }
      else if (on && on.getAttribute('data-t') === 'sua') { [].forEach.call(document.querySelectorAll('#nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === 'trinhchieu'); }); }
    }
    else if (d.type === 'clb-tab') { show(d.tab || 'trinhchieu'); if (d.thieu) send({ type: 'clb-missing' }); }
  });

  var h = (location.hash || '').replace('#', '');
  var start = TABS[h] ? h : (window.innerWidth < 700 ? 'nhap' : 'trinhchieu');
  show(start);
})();
</script>
</body>
</html>
